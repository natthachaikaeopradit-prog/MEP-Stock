    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsP7wBL4RZ3PFht9RPWpMu6PGV-4LTI",
            authDomain: "pw-hub-8e58c.firebaseapp.com",
            projectId: "pw-hub-8e58c",
            storageBucket: "pw-hub-8e58c.appspot.com",
            messagingSenderId: "968401119582",
            appId: "1:968401119582:web:d08e37ebf8a21798aec7cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const VVIP_USERNAMES = ['admin', 'DA1104', 'tar_admin', 'tarkun1104'];

        function isReservedVvipUsername(username) {
            if (!username) return false;
            return VVIP_USERNAMES.some(v => v.toLowerCase() === username.trim().toLowerCase());
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E";

        let usersDB = [];
        let companiesList = ['บริษัท MEP จำกัด', 'ไซต์งาน กทม. 1'];
        let companyOwnersDB = { 'บริษัท MEP จำกัด': 'admin', 'ไซต์งาน กทม. 1': 'admin' };
        let allowedMembersDB = { 'บริษัท MEP จำกัด': ['admin', 'DA1104', 'tar_admin', 'tarkun1104'], 'ไซต์งาน กทม. 1': ['admin', 'DA1104', 'tar_admin', 'tarkun1104'] };
        let companyToolsDB = {
            'บริษัท MEP จำกัด': [
                { id: 'E-001', name: 'สายไฟ THW', size: '1x2.5 sq.mm.', color: 'สีขาว', initialQty: 20, qty: 15, unit: 'ม้วน', img: '' },
                { id: 'W-001', name: 'ท่อ PVC (ตราช้าง)', size: '1/2 นิ้ว', color: 'สีฟ้า', initialQty: 100, qty: 82, unit: 'เส้น', img: '' },
                { id: 'T-001', name: 'สว่านกระแทกไร้สาย 18V', size: '-', color: 'สีน้ำเงิน', initialQty: 5, qty: 3, unit: 'เครื่อง', img: '' }
            ],
            'ไซต์งาน กทม. 1': [
                { id: 'S-001', name: 'นั่งร้านเหล็ก', size: '1.7 เมตร', color: 'สีเทา', initialQty: 50, qty: 40, unit: 'ชุด', img: '' }
            ]
        };
        let chatGroupsDB = {};
        let chatMessagesDB = {};
        let systemLogs = [];

        let currentUser = null;
        let currentCompany = '';
        let targetEditCompany = '';
        let toolsList = [];
        let tempAvatarData = null;
        let activeChatType = 'company';
        let activeChatTargetId = '';

        window.onload = function() {
            // ดึงข้อมูลจาก Firebase Realtime Database ทันทีที่เปิดหน้าเว็บ
            const dbRef = ref(db, 'mep_system_data');
            onValue(dbRef, (snapshot) => {
                const serverData = snapshot.val();
                if (serverData) {
                    usersDB = serverData.users || usersDB;
                    companiesList = serverData.companies || companiesList;
                    companyOwnersDB = serverData.owners || companyOwnersDB;
                    allowedMembersDB = serverData.members || allowedMembersDB;
                    companyToolsDB = serverData.tools || companyToolsDB;
                    chatGroupsDB = serverData.groups || chatGroupsDB;
                    chatMessagesDB = serverData.messages || chatMessagesDB;
                    systemLogs = serverData.logs || systemLogs;
                } else {
                    // หากยังไม่มีข้อมูลบนคลาวด์ ให้บันทึกค่าเริ่มต้นขึ้นไปครั้งแรก
                    saveDataToCloud();
                }

                // ตรวจสอบบัญชี Admin หลักเสมอ
                checkAndInitAdmins();

                if (currentCompany && companyToolsDB[currentCompany]) {
                    toolsList = companyToolsDB[currentCompany];
                    filterTools();
                }

                if (!document.getElementById('chat-modal').classList.contains('hidden')) {
                    renderChatChannelsAndUsers();
                    renderChatMessages();
                }

                if (!document.getElementById('member-modal').classList.contains('hidden')) {
                    openMemberBook();
                }

                if (!document.getElementById('company-modal').classList.contains('hidden')) {
                    renderCompanyList();
                }
            }, {
                onlyOnce: false // ให้ฟังชันก์ Realtime ทำงานตลอดเมื่อมีข้อมูลฝั่งอื่นเปลี่ยน
            });

            updateAutoCodePreview();
        };

        function checkAndInitAdmins() {
            const mainAdminAccounts = [
                { username: 'admin', password: '0808946255', name: 'ต้าร์ (VVIP Admin)', position: 'ผู้ดูแลระบบหลัก', department: 'บริหารจัดการ', age: 26, avatar: DEFAULT_AVATAR, isAdmin: true },
                { username: 'tarkun1104', password: '0808946255', name: 'ต้าร์ (tarkun1104 Admin)', position: 'ผู้ดูแลระบบหลัก', department: 'บริหารจัดการ', age: 26, avatar: DEFAULT_AVATAR, isAdmin: true }
            ];

            let updated = false;
            mainAdminAccounts.forEach(acc => {
                let existing = usersDB.find(u => u.username && u.username.toLowerCase() === acc.username.toLowerCase());
                if (!existing) {
                    usersDB.unshift(acc);
                    updated = true;
                } else {
                    if (!existing.isAdmin || !existing.password) {
                        existing.isAdmin = true;
                        existing.password = acc.password;
                        updated = true;
                    }
                }
            });
            if (updated) saveDataToCloud();
        }

        function saveDataToCloud() {
            set(ref(db, 'mep_system_data'), {
                users: usersDB,
                companies: companiesList,
                owners: companyOwnersDB,
                members: allowedMembersDB,
                tools: companyToolsDB,
                groups: chatGroupsDB,
                messages: chatMessagesDB,
                logs: systemLogs
            }).catch((error) => {
                console.error("Firebase save error:", error);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูลสู่ออนไลน์!");
            });
        }

        function saveData() {
            saveDataToCloud();
        }

        function refreshData() {
            let refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('fa-spin');
            setTimeout(() => {
                if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            }, 500);
        }

        function logAction(user, company, action) {
            let log = {
                time: new Date().toLocaleString('th-TH'),
                user: user,
                company: company,
                action: action
            };
            systemLogs.unshift(log);
            saveDataToCloud();
        }

        function shareStockLink() {
            let shareUrl = window.location.href;
            let shareTitle = `ระบบคลังอุปกรณ์ MEP Stock Management (${currentCompany || 'ระบบหลัก'})`;
            if (navigator.share) {
                navigator.share({ title: shareTitle, text: `เข้ามาดูระบบจัดการคลังอุปกรณ์ MEP ของเราได้ที่ลิงก์นี้ครับ:`, url: shareUrl })
                .then(() => { logAction(currentUser ? currentUser.name : 'Guest', currentCompany || '-', 'แชร์ลิงก์ระบบสำเร็จผ่าน Web Share API'); });
            } else {
                copyLinkToClipboard(shareUrl);
            }
        }

        function copyLinkToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("คัดลอกลิงก์สำหรับแชร์ไปยังคลิปบอร์ดเรียบร้อยแล้ว!");
            }).catch(err => { alert("ไม่สามารถคัดลอกลิงก์ได้"); });
        }

        function canAccessCompany(compName) {
            if (!currentUser) return false;
            let curUname = (currentUser.username || '').trim().toLowerCase();
            if (currentUser.isAdmin || VVIP_USERNAMES.some(u => u.toLowerCase() === curUname)) return true;
            if (companyOwnersDB[compName] && companyOwnersDB[compName].trim().toLowerCase() === curUname) return true;
            if (currentUser.createdByOwner && currentUser.createdByOwner.trim().toLowerCase() === (companyOwnersDB[compName] || '').trim().toLowerCase()) return true;
            if (currentUser.department === compName) return true;
            if (allowedMembersDB[compName] && allowedMembersDB[compName].some(m => m.trim().toLowerCase() === curUname)) return true;
            return false;
        }

        function isWarehouseOwner() {
            if(!currentUser) return false;
            let curUname = (currentUser.username || '').trim().toLowerCase();
            if(currentUser.isAdmin || VVIP_USERNAMES.some(u => u.toLowerCase() === curUname)) return true;
            return (companyOwnersDB[currentCompany] || '').trim().toLowerCase() === curUname;
        }

        window.switchAuthTab = function(tab) {
            let loginBtn = document.getElementById('tab-login');
            let regBtn = document.getElementById('tab-register');
            let loginForm = document.getElementById('form-login');
            let regForm = document.getElementById('form-register');

            if(tab === 'login') {
                loginBtn.className = "flex-1 py-3 text-center font-medium border-b-2 border-emerald-500 text-emerald-400 transition";
                regBtn.className = "flex-1 py-3 text-center font-medium text-gray-400 hover:text-gray-200 border-b-2 border-transparent transition";
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regBtn.className = "flex-1 py-3 text-center font-medium border-b-2 border-blue-500 text-blue-400 transition";
                loginBtn.className = "flex-1 py-3 text-center font-medium text-gray-400 hover:text-gray-200 border-b-2 border-transparent transition";
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        };

        window.handleLogin = function(e) {
            e.preventDefault();
            let u = document.getElementById('login-username').value.trim();
            let p = document.getElementById('login-password').value.trim();

            let found = usersDB.find(x => x.username && x.username.trim().toLowerCase() === u.toLowerCase() && x.password.trim() === p);
            if(found) {
                currentUser = found;
                if (VVIP_USERNAMES.some(v => v.toLowerCase() === u.toLowerCase())) {
                    currentUser.isAdmin = true;
                }
                updateHeaderProfileDisplay();
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('nav-profile').classList.remove('hidden');
                document.getElementById('nav-profile').classList.add('flex');
                logAction(currentUser.name, "-", isWarehouseOwner() ? "เข้าสู่ระบบด้วยสิทธิ์ VVIP Admin / เจ้าของคลัง" : "เข้าสู่ระบบ");
                toggleCompanyModal();
            } else {
                alert("ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง!");
            }
        };

        window.handleRegister = function(e) {
            e.preventDefault();
            let name = document.getElementById('reg-fullname').value.trim();
            let u = document.getElementById('reg-username').value.trim();
            let p = document.getElementById('reg-password').value.trim();
            let pos = document.getElementById('reg-position').value.trim();
            let dept = document.getElementById('reg-department').value.trim();
            let age = document.getElementById('reg-age').value.trim();

            if (isReservedVvipUsername(u)) {
                alert("Username นี้ได้รับการสงวนสิทธิ์สำหรับระบบ VVIP ผู้ดูแลระบบ ไม่สามารถใช้ในการสมัครได้");
                return;
            }

            if(usersDB.some(x => x.username && x.username.trim().toLowerCase() === u.toLowerCase())) {
                alert("Username นี้มีผู้ใช้งานแล้ว!");
                return;
            }

            usersDB.push({ 
                username: u, password: p, name: name, 
                position: pos || 'พนักงาน', department: dept || 'ทั่วไป', 
                age: age || '-', avatar: DEFAULT_AVATAR, isAdmin: false 
            });
            saveDataToCloud();
            logAction(name, "-", "ลงทะเบียนสมาชิกใหม่");
            alert("สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ");
            switchAuthTab('login');
        };

        window.logout = function() {
            currentUser = null;
            currentCompany = '';
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('flex');
            document.getElementById('nav-profile').classList.add('hidden');
            document.getElementById('nav-profile').classList.remove('flex');
            document.getElementById('auth-section').classList.remove('hidden');
        };

        function updateHeaderProfileDisplay() {
            if(!currentUser) return;
            document.getElementById('user-display-name').innerText = currentUser.name;
            document.getElementById('nav-avatar').src = currentUser.avatar || DEFAULT_AVATAR;
            const userBadge = document.getElementById('user-admin-badge');
            const currentUname = (currentUser.username || '').trim().toLowerCase();
            const isVVIP = VVIP_USERNAMES.some(id => id.toLowerCase() === currentUname) || currentUser.isAdmin === true;
            if (isVVIP) {
                userBadge.innerText = 'VVIP ผู้ดูแลระบบ';
                userBadge.classList.remove('hidden');
            } else {
                userBadge.classList.add('hidden');
            }
        }

        window.openProfileModal = function() {
            if(!currentUser) return;
            document.getElementById('profile-name').value = currentUser.name || '';
            document.getElementById('profile-position').value = currentUser.position || '';
            document.getElementById('profile-department').value = currentUser.department || '';
            document.getElementById('profile-age').value = currentUser.age || '';
            tempAvatarData = currentUser.avatar || DEFAULT_AVATAR;
            document.getElementById('profile-avatar-preview').src = tempAvatarData;
            document.getElementById('profile-modal').classList.remove('hidden');
        };

        window.closeProfileModal = function() {
            document.getElementById('profile-modal').classList.add('hidden');
        };

        window.handleAvatarChange = function(e) {
            let file = e.target.files[0];
            if(file) {
                if (file.size > 2 * 1024 * 1024) { alert("กรุณาเลือกไฟล์รูปภาพขนาดไม่เกิน 2MB"); return; }
                let reader = new FileReader();
                reader.onload = function(evt) {
                    let img = new Image();
                    img.onload = function() {
                        let canvas = document.createElement('canvas');
                        let max_size = 200, width = img.width, height = img.height;
                        if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                        else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                        canvas.width = width; canvas.height = height;
                        let ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        tempAvatarData = canvas.toDataURL("image/jpeg", 0.7);
                        document.getElementById('profile-avatar-preview').src = tempAvatarData;
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        window.handleSaveProfile = function(e) {
            e.preventDefault();
            if(!currentUser) return;
            currentUser.name = document.getElementById('profile-name').value.trim();
            currentUser.position = document.getElementById('profile-position').value.trim();
            currentUser.department = document.getElementById('profile-department').value.trim();
            currentUser.age = document.getElementById('profile-age').value.trim();
            currentUser.avatar = tempAvatarData;

            let idx = usersDB.findIndex(u => u.username && u.username.trim().toLowerCase() === currentUser.username.trim().toLowerCase());
            if(idx !== -1) { usersDB[idx] = currentUser; }

            saveDataToCloud();
            updateHeaderProfileDisplay();
            logAction(currentUser.name, currentCompany || "-", "อัปเดตข้อมูลและรูปโปรไฟล์ส่วนตัว");
            alert("บันทึกข้อมูลโปรไฟล์เรียบร้อยแล้ว!");
            closeProfileModal();
        };

        window.toggleCompanyModal = function() {
            let modal = document.getElementById('company-modal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) { renderCompanyList(); }
        };

        function renderCompanyList() {
            let container = document.getElementById('company-list');
            container.innerHTML = '';
            let accessibleCompanies = companiesList.filter(c => canAccessCompany(c));
            if (accessibleCompanies.length === 0) {
                container.innerHTML = `<div class="p-4 bg-red-500/15 border border-red-500/20 text-red-400 rounded-xl text-center text-xs">คุณยังไม่มีสิทธิ์เข้าถึงคลังบริษัทใดๆ</div>`;
                return;
            }
            accessibleCompanies.forEach(comp => {
                let div = document.createElement('div');
                div.className = "w-full p-3 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium text-sm transition flex items-center justify-between border border-gray-700";
                let ownerTag = companyOwnersDB[comp] ? `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30 ml-2">เจ้าของ: ${escapeHTML(companyOwnersDB[comp])}</span>` : '';
                let curUname = currentUser ? currentUser.username.trim().toLowerCase() : '';
                let compOwnerUname = (companyOwnersDB[comp] || '').trim().toLowerCase();
                let adminControls = '';
                if(currentUser && (currentUser.isAdmin || compOwnerUname === curUname || VVIP_USERNAMES.some(v => v.toLowerCase() === curUname))) {
                    adminControls = `
                        <button onclick="openEditCompanyModal(event, '${escapeHTML(comp)}')" title="เปลี่ยนชื่อบริษัท" class="text-amber-400 hover:text-amber-300 p-1 ml-2"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteCompany(event, '${escapeHTML(comp)}')" title="ลบบริษัท" class="text-red-400 hover:text-red-300 p-1 ml-1"><i class="fa-solid fa-trash"></i></button>
                    `;
                }
                div.innerHTML = `
                    <div onclick="selectCompany('${escapeHTML(comp)}')" class="flex-1 flex items-center cursor-pointer truncate">
                        <i class="fa-regular fa-building text-emerald-400 mr-2"></i>
                        <span class="truncate">${escapeHTML(comp)}</span>${ownerTag}
                    </div>
                    <div class="flex items-center">
                        ${adminControls}
                        <i onclick="selectCompany('${escapeHTML(comp)}')" class="fa-solid fa-chevron-right text-xs text-gray-500 cursor-pointer ml-2"></i>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.openEditCompanyModal = function(e, compName) {
            e.stopPropagation();
            if(!isWarehouseOwner()) return;
            targetEditCompany = compName;
            document.getElementById('edit-company-name-input').value = compName;
            document.getElementById('edit-company-modal').classList.remove('hidden');
        };

        window.closeEditCompanyModal = function() {
            document.getElementById('edit-company-modal').classList.add('hidden');
            targetEditCompany = '';
        };

        window.handleSaveCompanyEdit = function(e) {
            e.preventDefault();
            let newName = document.getElementById('edit-company-name-input').value.trim();
            if(!newName || newName === targetEditCompany) { closeEditCompanyModal(); return; }
            if(companiesList.includes(newName)) { alert("มีบริษัทชื่อนี้อยู่ในระบบแล้ว!"); return; }

            let idx = companiesList.indexOf(targetEditCompany);
            if(idx !== -1) { companiesList[idx] = newName; }
            if(companyOwnersDB[targetEditCompany]) { companyOwnersDB[newName] = companyOwnersDB[targetEditCompany]; delete companyOwnersDB[targetEditCompany]; }
            if(allowedMembersDB[targetEditCompany]) { allowedMembersDB[newName] = allowedMembersDB[targetEditCompany]; delete allowedMembersDB[targetEditCompany]; }
            if(companyToolsDB[targetEditCompany]) { companyToolsDB[newName] = companyToolsDB[targetEditCompany]; delete companyToolsDB[targetEditCompany]; }
            if(currentCompany === targetEditCompany) { currentCompany = newName; document.getElementById('active-company-tag').innerText = currentCompany; document.getElementById('user-display-company').innerText = "บริษัท: " + currentCompany; }

            saveDataToCloud();
            alert("เปลี่ยนชื่อบริษัทเรียบร้อยแล้ว!");
            closeEditCompanyModal();
            renderCompanyList();
        };

        window.deleteCompany = function(e, compName) {
            e.stopPropagation();
            if(!isWarehouseOwner()) return;
            if(confirm(`คุณต้องการลบบริษัท "${compName}" และข้อมูลสต็อกทั้งหมดใช่หรือไม่?`)) {
                companiesList = companiesList.filter(c => c !== compName);
                delete companyOwnersDB[compName];
                delete allowedMembersDB[compName];
                delete companyToolsDB[compName];
                saveDataToCloud();
                renderCompanyList();
            }
        };

        window.handleCreateCompany = function(e) {
            e.preventDefault();
            let input = document.getElementById('new-company-name');
            let cName = input.value.trim();
            if(cName && !companiesList.includes(cName)) {
                companiesList.push(cName);
                companyOwnersDB[cName] = currentUser.username;
                allowedMembersDB[cName] = [currentUser.username];
                companyToolsDB[cName] = [];
                saveDataToCloud();
                logAction(currentUser.name, cName, "สร้างบริษัทใหม่ (เป็นเจ้าของคลัง)");
                input.value = '';
                selectCompany(cName);
            }
        };

        window.selectCompany = function(compName) {
            if (!canAccessCompany(compName)) { alert(`คุณไม่มีสิทธิ์เข้าใช้งานคลัง: ${compName}`); return; }
            currentCompany = compName;
            document.getElementById('active-company-tag').innerText = currentCompany;
            document.getElementById('user-display-company').innerText = "บริษัท: " + currentCompany;

            if(!companyToolsDB[currentCompany]) { companyToolsDB[currentCompany] = []; }
            toolsList = companyToolsDB[currentCompany];

            toggleCompanyModal();
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('flex');

            let ownerBtn = document.getElementById('owner-create-user-btn');
            if(isWarehouseOwner()) { ownerBtn.classList.remove('hidden'); } else { ownerBtn.classList.add('hidden'); }

            updateAutoCodePreview();
            filterTools();
            logAction(currentUser.name, currentCompany, "เลือกเข้าจัดการคลัง");
        };

        window.openOwnerCreateUserModal = function() {
            if(!isWarehouseOwner()) { alert("สิทธิ์เฉพาะเจ้าของคลังหรือ Admin เท่านั้น!"); return; }
            document.getElementById('owner-create-user-modal').classList.remove('hidden');
        };

        window.closeOwnerCreateUserModal = function() {
            document.getElementById('owner-create-user-modal').classList.add('hidden');
        };

        window.handleOwnerCreateUser = function(e) {
            e.preventDefault();
            if(!isWarehouseOwner()) return;
            let name = document.getElementById('owner-direct-fullname').value.trim();
            let u = document.getElementById('owner-direct-username').value.trim();
            let p = document.getElementById('owner-direct-password').value.trim();
            let pos = document.getElementById('owner-direct-position').value.trim();
            let dept = document.getElementById('owner-direct-department').value.trim();

            if (isReservedVvipUsername(u)) { alert("Username นี้ได้รับการสงวนสิทธิ์สำหรับระบบ VVIP ผู้ดูแลระบบ"); return; }
            if(usersDB.some(x => x.username && x.username.trim().toLowerCase() === u.toLowerCase())) { alert("Username นี้มีผู้ใช้งานแล้วในระบบ!"); return; }

            usersDB.push({ username: u, password: p, name: name, position: pos || 'พนักงาน', department: dept || currentCompany, age: '-', avatar: DEFAULT_AVATAR, isAdmin: false, createdByOwner: currentUser.username });
            if (!allowedMembersDB[currentCompany]) { allowedMembersDB[currentCompany] = []; }
            allowedMembersDB[currentCompany].push(u);

            saveDataToCloud();
            alert(`สร้างบัญชีสำเร็จ!\nUsername: ${u}\nPassword: ${p}`);
            closeOwnerCreateUserModal();
        };

        window.updateAutoCodePreview = function() {
            let catElement = document.getElementById('tool-category');
            if (!catElement) return;
            let cat = catElement.value, maxNum = 0;
            toolsList.forEach(item => {
                if (item.id && item.id.startsWith(cat + '-')) {
                    let rest = item.id.slice(cat.length + 1);
                    let num = parseInt(rest.split('-')[0], 10);
                    if (!isNaN(num) && num > maxNum) maxNum = num;
                }
            });
            let code = `${cat}-${String(maxNum + 1).padStart(3, '0')}`;
            let codePreview = document.getElementById('tool-code-preview');
            if (codePreview) codePreview.value = code;
        };

        window.handleAddTool = function(e) {
            e.preventDefault();
            let code = document.getElementById('tool-code-preview').value.trim();
            let name = document.getElementById('tool-name').value.trim();
            let size = document.getElementById('tool-size').value.trim() || '-';
            let color = document.getElementById('tool-color').value.trim() || '-';
            let initial = parseInt(document.getElementById('tool-initial').value);
            let unit = document.getElementById('tool-unit').value.trim();
            let imgInput = document.getElementById('tool-image');

            let newTool = { id: code, name: name, size: size, color: color, initialQty: initial, qty: initial, unit: unit, img: '' };
            if(imgInput.files && imgInput.files[0]) {
                let file = imgInput.files[0];
                let reader = new FileReader();
                reader.onload = function(evt) {
                    newTool.img = evt.target.result;
                    saveAndRenderNewTool(newTool);
                };
                reader.readAsDataURL(file);
            } else {
                saveAndRenderNewTool(newTool);
            }
        };

        function saveAndRenderNewTool(tool) {
            toolsList.push(tool);
            companyToolsDB[currentCompany] = toolsList;
            saveDataToCloud();
            logAction(currentUser.name, currentCompany, `เพิ่มอุปกรณ์ [${tool.id}:${tool.name}]`);
            document.getElementById('tool-name').value = '';
            document.getElementById('tool-size').value = '';
            document.getElementById('tool-color').value = '';
            document.getElementById('tool-image').value = '';
            updateAutoCodePreview();
            filterTools();
        }

        window.adjustQty = function(toolId, delta) {
            let item = toolsList.find(x => x.id === toolId);
            if(item) {
                item.qty = Math.max(0, item.qty + delta);
                companyToolsDB[currentCompany] = toolsList;
                saveDataToCloud();
                logAction(currentUser.name, currentCompany, `ปรับจำนวน [${item.id}] เป็น ${item.qty}${item.unit}`);
                filterTools();
            }
        };

        window.deleteTool = function(toolId) {
            if(!isWarehouseOwner()) return;
            let item = toolsList.find(x => x.id === toolId);
            if(item && confirm(`คุณต้องการลบอุปกรณ์ "${item.name}" [${toolId}] หรือไม่?`)) {
                toolsList = toolsList.filter(x => x.id !== toolId);
                companyToolsDB[currentCompany] = toolsList;
                saveDataToCloud();
                filterTools();
            }
        };

        window.filterTools = function() {
            let query = document.getElementById('search-box').value.toLowerCase().trim();
            let statusFilter = document.getElementById('filter-status').value;

            let filtered = toolsList.filter(t => {
                let matchQuery = t.id.toLowerCase().includes(query) || t.name.toLowerCase().includes(query);
                let matchStatus = true;
                if (statusFilter === 'low') matchStatus = t.qty <= 5;
                else if (statusFilter === 'over') matchStatus = t.qty > 100;
                else if (statusFilter === 'normal') matchStatus = t.qty > 5 && t.qty <= 100;
                return matchQuery && matchStatus;
            });
            renderToolTable(filtered);
        };

        function renderToolTable(list) {
            let lowCount = toolsList.filter(t => t.qty <= 5).length;
            let overCount = toolsList.filter(t => t.qty > 100).length;
            let normalCount = toolsList.length - lowCount - overCount;

            document.getElementById('count-low').innerText = `${lowCount} รายการ`;
            document.getElementById('count-normal').innerText = `${normalCount} รายการ`;
            document.getElementById('count-over').innerText = `${overCount} รายการ`;

            let tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = '';
            if(list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-500">ไม่พบรายการอุปกรณ์ในคลังนี้</td></tr>`;
                return;
            }
            list.forEach((t) => {
                let imgTag = t.img ? `<img src="${t.img}" class="w-10 h-10 object-cover rounded-lg border border-gray-700">` : `<div class="w-10 h-10 bg-gray-800 rounded-lg flex items-center justify-center text-gray-600 text-xs"><i class="fa-solid fa-image"></i></div>`;
                let statusBadge = t.qty <= 5 ? `<span class="bg-red-500/15 text-red-400 px-2 py-1 rounded-full text-xs">ขาด/เหลือน้อย</span>` : (t.qty > 100 ? `<span class="bg-blue-500/15 text-blue-400 px-2 py-1 rounded-full text-xs">สต็อกเกิน</span>` : `<span class="bg-emerald-500/15 text-emerald-400 px-2 py-1 rounded-full text-xs">ปกติ</span>`);
                
                let deleteToolBtn = isWarehouseOwner() ? `<button onclick="deleteTool('${escapeHTML(t.id)}')" class="w-7 h-7 bg-red-500/20 text-red-400 rounded-lg"><i class="fa-solid fa-trash text-xs"></i></button>` : '';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/40 transition">
                        <td class="px-4 py-3 font-mono font-bold text-emerald-400">${escapeHTML(t.id)}</td>
                        <td class="px-4 py-3">${imgTag}</td>
                        <td class="px-4 py-3"><div class="font-medium text-gray-200">${escapeHTML(t.name)}</div><div class="text-xs text-gray-400">${escapeHTML(t.size || '-')} | ${escapeHTML(t.color || '-')}</div></td>
                        <td class="px-4 py-3 text-center"><span class="text-emerald-400 font-bold">${t.qty}</span> / ${t.initialQty}${escapeHTML(t.unit)}</td>
                        <td class="px-4 py-3 text-center">${statusBadge}</td>
                        <td class="px-4 py-3 text-center">
                            <div class="inline-flex items-center gap-1 bg-gray-800 p-1 rounded-xl">
                                <button onclick="adjustQty('${escapeHTML(t.id)}', -1)" class="w-7 h-7 bg-amber-500/20 text-amber-400 rounded-lg font-bold">-</button>
                                <button onclick="adjustQty('${escapeHTML(t.id)}', 1)" class="w-7 h-7 bg-emerald-500/20 text-emerald-400 rounded-lg font-bold">+</button>
                                ${deleteToolBtn}
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        // ระบบแชตและสมุดสมาชิกเชื่อมต่อออนไลน์เรียบร้อย
        window.openChatLobby = function() { document.getElementById('chat-modal').classList.remove('hidden'); activeChatType = 'company'; activeChatTargetId = currentCompany; renderChatChannelsAndUsers(); selectChatChannel('company', currentCompany); };
        window.closeChatLobby = function() { document.getElementById('chat-modal').classList.add('hidden'); };
        window.openMemberBook = function() { renderMemberListModal(); document.getElementById('member-modal').classList.remove('hidden'); };
        window.closeMemberBook = function() { document.getElementById('member-modal').classList.add('hidden'); };
        window.openSummaryBook = function() { document.getElementById('summary-modal').classList.remove('hidden'); };
        window.closeSummaryBook = function() { document.getElementById('summary-modal').classList.add('hidden'); };

        function renderMemberListModal() {
            let container = document.getElementById('member-list-container');
            container.innerHTML = '';
            usersDB.forEach(u => {
                let isVvip = VVIP_USERNAMES.some(v => v.toLowerCase() === (u.username || '').toLowerCase()) || u.isAdmin;
                container.innerHTML += `
                    <div class="p-3 bg-gray-800 rounded-xl flex items-center justify-between border border-gray-700">
                        <div class="flex items-center gap-3">
                            <img src="${u.avatar || DEFAULT_AVATAR}" class="w-10 h-10 rounded-xl object-cover">
                            <div>
                                <div class="font-bold text-gray-200 text-sm">${escapeHTML(u.name)} ${isVvip ? '<span class="text-amber-400 text-xs">[VVIP]</span>' : ''}</div>
                                <div class="text-xs text-gray-400">@${escapeHTML(u.username)} | ตำแหน่ง: ${escapeHTML(u.position || '-')}</div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        window.renderChatChannelsAndUsers = function() {
            let channelContainer = document.getElementById('chat-channel-list');
            let dmContainer = document.getElementById('chat-dm-list');
            channelContainer.innerHTML = `<button onclick="selectChatChannel('company', '${escapeHTML(currentCompany)}')" class="w-full text-left px-3 py-2 rounded-xl text-xs text-emerald-400 font-bold bg-emerald-600/2k"><i class="fa-solid fa-building mr-1"></i>${escapeHTML(currentCompany)} (แชตหลัก)</button>`;
            dmContainer.innerHTML = '';
            let curUname = currentUser ? currentUser.username.trim().toLowerCase() : '';
            usersDB.filter(u => u.username && u.username.trim().toLowerCase() !== curUname).forEach(u => {
                dmContainer.innerHTML += `<button onclick="selectChatChannel('direct', '${escapeHTML(u.username)}')" class="w-full text-left px-3 py-2 rounded-xl text-xs text-gray-300 hover:bg-gray-800 flex items-center gap-2"><img src="${u.avatar || DEFAULT_AVATAR}" class="w-5 h-5 rounded-full object-cover"><span>${escapeHTML(u.name)}</span></button>`;
            });
        };

        window.selectChatChannel = function(type, targetId) {
            activeChatType = type;
            activeChatTargetId = targetId;
            renderChatMessages();
        };

        function getChatKey() {
            if(activeChatType === 'company') return `comp_${currentCompany}`;
            if(activeChatType === 'direct') {
                let pair = [currentUser.username.trim().toLowerCase(), activeChatTargetId.trim().toLowerCase()].sort();
                return `dm_${pair[0]}_${pair[1]}`;
            }
            return 'general';
        }

        window.sendChatMessage = function() {
            let input = document.getElementById('chat-input');
            let msg = input.value.trim();
            if(!msg) return;
            let chatKey = getChatKey();
            if(!chatMessagesDB[chatKey]) chatMessagesDB[chatKey] = [];
            chatMessagesDB[chatKey].push({ sender: currentUser.name, senderUsername: currentUser.username, avatar: currentUser.avatar || DEFAULT_AVATAR, time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), text: msg });
            saveDataToCloud();
            input.value = '';
            renderChatMessages();
        };

        function renderChatMessages() {
            let container = document.getElementById('chat-box-messages');
            container.innerHTML = '';
            let chatKey = getChatKey();
            let list = chatMessagesDB[chatKey] || [];
            let curUname = currentUser ? currentUser.username.trim().toLowerCase() : '';
            list.forEach(m => {
                let isMe = (m.senderUsername || '').trim().toLowerCase() === curUname;
                container.innerHTML += `
                    <div class="flex items-start gap-2.5 ${isMe ? 'flex-row-reverse' : ''}">
                        <img src="${m.avatar || DEFAULT_AVATAR}" class="w-7 h-7 rounded-full object-cover">
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            <span class="text-[10px] text-gray-500 mb-1">${escapeHTML(m.sender)} (${m.time})</span>
                            <div class="p-3 rounded-2xl text-sm max-w-xs ${isMe ? 'bg-emerald-600 text-gray-950 font-medium' : 'bg-gray-800 text-gray-200'}">${escapeHTML(m.text)}</div>
                        </div>
                    </div>`;
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
